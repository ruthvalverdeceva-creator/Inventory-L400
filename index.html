<script>
const $=id=>document.getElementById(id);
const nk=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const V=(r,...ns)=>{for(const k in r)if(ns.some(n=>nk(n)==nk(k)))return r[k]==null?'':String(r[k]).trim();return''};
const T=s=>String(s||'').trim().toUpperCase();
let S={tiempos:[],registros:[]},C={operarios:[],cantidad:[]};
async function api(b){try{const r=await(await fetch('/api',{method:'POST',body:JSON.stringify(b)})).json();if(r.state){S=r.state;refresh()}return r}catch(e){toast('Sin conexión con el servidor');return{ok:false,error:'Sin conexión'}}}
function refresh(){if($('s2').classList.contains('on'))pasillos();if($('s3').classList.contains('on'))avance()}
new EventSource('/events').onmessage=e=>{S=JSON.parse(e.data);refresh()};
fetch('/api/init').then(r=>r.json()).then(j=>{C=j;loadUsers()});
let user='',pas='',prod=null,accion='',selPas='';
function toast(m,c){const t=$('toast');t.textContent=m;t.style.background=c||'#c00';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000)}
function go(n){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on')}
function ask(msg,btns){$('mm').textContent=msg;$('mb').innerHTML='';btns.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('mod').classList.remove('on');f&&f()};$('mb').appendChild(b)});$('mod').classList.add('on')}
// ===== Pantalla 1 =====
function loadUsers(){$('usr').innerHTML=C.operarios.map(o=>`<option>${V(o,'NOMBRE')}</option>`).join('')}
function entrar(){if(!$('usr').value)return toast('Sin datos del servidor');user=$('usr').value;go(2);pasillos()}
// ===== Pantalla 2 =====
const num=s=>parseInt(String(s).replace(/\D/g,''))||0;
const tp=p=>S.tiempos.find(t=>T(V(t,'Pasillo'))==T(p));
function pasillos(){$('usrl').textContent='Usuario: '+user.toUpperCase();
 $('lista').innerHTML=[...S.tiempos].sort((a,b)=>num(V(a,'Pasillo'))-num(V(b,'Pasillo'))).map(t=>{const e=V(t,'Estado')||'Pendiente',o=V(t,'Operario');
 return `<div class="pas" onclick="selP('${V(t,'Pasillo')}')"><span>${V(t,'Pasillo')}</span><span>${e}</span><span class="dot ${e.slice(0,2)}"></span><span>${o||'-'}</span></div>`}).join('')}
function selP(p){selPas=p;const t=tp(p),e=V(t,'Estado'),o=V(t,'Operario');
 if(e=='Cerrado')return ask(`El ${p} ya se encuentra CERRADO. No es posible ingresar ni reabrir.`,[['Aceptar']]);
 if(e=='En Proceso'&&T(o)!=T(user))return ask(`El ${p} está siendo trabajado por ${o}. No tienes acceso a este pasillo.`,[['Aceptar']]);
 if(e=='En Proceso')return ask(`¿Deseas continuar el conteo del ${p}?`,[['Si',()=>abrir(p)],['No']]);
 ask(`El ${p} está en estado PENDIENTE. ¿Deseas iniciar su conteo?`,[['Si',async()=>{const r=await api({t:'iniciar',pasillo:p,user});r.ok?abrir(p):ask(r.error,[['Aceptar']])}],['No']])}
// ===== Pantalla 3 =====
const regs=()=>S.registros.filter(r=>T(V(r,'Pasillo'))==T(pas));
function abrir(p){pas=p;$('hp').textContent=p;borrar();go(3);avance()}
function avance(){const n=regs().length,t=num(V(tp(pas),'Total de Ubicaciones'));
 $('av').textContent=`Avance: ${n} / ${t} - ${t?Math.round(n/t*100):0}%`;
 const u=regs().slice(-1)[0];$('ult').textContent=u?`${V(u,'Ubicacion')} | ${V(u,'Codigo')} | ${V(u,'Codigo')=='VACÍO'?'-':V(u,'Total')+' '+V(u,'UMA')}`:'Sin registros en este pasillo'}
function borrar(){prod=null;['ub','sku','uma','desc','cama','niv','sal','tot'].forEach(i=>$(i).value='');$('ub').focus()}
function calc(){$('tot').value=(+$('cama').value||0)*(+$('niv').value||0)+(+$('sal').value||0)}
$('ub').addEventListener('change',()=>{if($('ub').value.trim())$('sku').focus()});
$('sku').addEventListener('change',()=>{const u=T($('ub').value),s=T($('sku').value);
 prod=C.cantidad.find(c=>T(V(c,'Ubicación'))==u&&(T(V(c,'Producto'))==s||T(V(c,'EAN'))==s))||null;
 if(!prod){toast('El SKU/EAN no coincide con la ubicación escaneada');$('sku').value='';return}
 $('sku').value=V(prod,'Producto');$('uma').value=V(prod,'UMA');$('desc').value=V(prod,'Descripción producto');$('cama').value=V(prod,'CAMA');calc();$('niv').focus()});
$('niv').addEventListener('change',()=>{calc();$('sal').focus()});
['niv','sal'].forEach(i=>$(i).addEventListener('input',calc));
let rid=null;async function reg(cod,desc,uma,cama,niv,sal,tot){rid=rid||Date.now().toString(36)+Math.random().toString(36).slice(2);const r=await api({t:'guardar',rid,pasillo:pas,user,Ubicacion:$('ub').value.trim(),Codigo:cod,Descripcion:desc,UMA:uma,CamaPqt:cama,Niveles:niv,Saldo:sal,Total:tot});if(!r.ok){if(r.error!='Sin conexión')rid=null;return ask(r.error,[['Aceptar']])}rid=null;borrar();avance()}
function guardar(){const u=$('ub').value.trim();
 if(regs().some(r=>V(r,'Ubicacion')==u&&u))return ask(`⚠️ ERROR: La ubicación ${u} ya fue registrada anteriormente en este pasillo.`,[['Aceptar',()=>{$('ub').value='';$('sku').value='';$('niv').value='';$('sal').value='';$('ub').focus()}]]);
 if(!u)return toast('Debe escanear la ubicación obligatoriamente.');
 if(!$('sku').value.trim())return ask(`¿Deseas registrar la ubicación ${u} como VACÍA?`,[['Si',()=>reg('VACÍO','UBICACIÓN VACÍA','-',0,0,0,0)],['No']]);
 calc();reg($('sku').value,$('desc').value,$('uma').value,+$('cama').value||0,+$('niv').value||0,+$('sal').value||0,+$('tot').value||0)}
function fin(){const n=regs().length,t=num(V(tp(pas),'Total de Ubicaciones'));
 ask(n<t?`⚠️ ¡Atención! Aún hay ubicaciones sin registrar (${n} de ${t}). ¿Deseas finalizar de todos modos?`:`¿Estás seguro de cerrar el pasillo ${pas}?`,
 [['Si',async()=>{const r=await api({t:'finalizar',pasillo:pas,user});if(!r.ok)return toast(r.error);pas='';go(2);pasillos()}],['No']])}
function pend(){const l7=s=>T(s).slice(-7),hechas=regs().map(r=>l7(V(r,'Ubicacion')));
 const ok=c=>!hechas.includes(l7(V(c,'Ubicación')));
 const u=[...new Set(C.cantidad.filter(c=>V(c,'PASILLO')==pas&&ok(c)).map(c=>V(c,'Ubicación')))];
 $('pl').innerHTML=u.length?u.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${x}</div>`).join(''):'<p style="text-align:center">Sin pendientes</p>';$('pen').classList.add('on')}
</script></body></html>
